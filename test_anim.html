<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Animation Test</title>
<link rel="stylesheet" href="speeder_animate.css?v=999">
<style>
body { background: #042018; padding: 40px; font-family: monospace; color: #96b896; }

/* 模拟index.html的CSS cascade */
.hero-card {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 22px 24px;
  background: rgba(15,45,30,0.08);
  border: 1px solid rgba(150,220,180,0.05);
  border-radius: 18px;
  text-decoration: none;
  color: #d8e8dc;
  transform-style: preserve-3d;
  perspective: 800px;
  box-shadow: 0 1px 8px rgba(0,0,0,0.05);
  animation: cardSpringIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes cardSpringIn {
  0%   { transform: translateY(40px) scale(0.95); opacity: 0; }
  60%  { transform: translateY(-8px) scale(1.02); opacity: 1; }
  100% { transform: translateY(0) scale(1); }
}
.tilt-card:nth-child(2) { animation-delay: 0.1s; }
.tilt-card:nth-child(3) { animation-delay: 0.2s; }

/* hero-cards下的tilt-card禁用动画 */
.hero-cards .tilt-card { animation: none; }

/* hero-cards下的hero-card.anim-slide-right强制禁用 */
.hero-cards .hero-card.anim-slide-right { animation: none !important; }

.hero-cards { display: flex; flex-direction: column; gap: 16px; width: 400px; }
</style>
</head>
<body>
<h3 style="color:#96b896;">TEST: hero-card + tilt-card + anim-slide-right</h3>
<p>打开F12控制台看调试信息，或等5秒看下方结果</p>
<hr style="border-color:#48564e; margin: 20px 0;">
<div class="hero-cards">
  <a href="#" class="hero-card tilt-card anim-slide-right" id="hc1">Card 1 (should slide from right)</a>
</div>
<hr style="border-color:#48564e; margin: 20px 0;">
<div id="results" style="background:#0a2820; padding:20px; border-radius:8px; white-space:pre-wrap; font-size:13px;"></div>
<script>
function log(msg) {
  console.log(msg);
  document.getElementById('results').textContent += msg + '\n';
}
window.addEventListener('load', function() {
  setTimeout(function() {
    var el = document.getElementById('hc1');
    var cs = getComputedStyle(el);
    log('animation: ' + cs.animation);
    log('animation-name: ' + cs.animationName);
    log('animation-duration: ' + cs.animationDuration);
    log('has .on class: ' + el.classList.contains('on'));
    log('opacity: ' + cs.opacity);
    log('transform: ' + cs.transform);

    // 手动加.on测试
    el.classList.add('on');
    var cs2 = getComputedStyle(el);
    log('\n加.on之后:');
    log('opacity: ' + cs2.opacity);
    log('transform: ' + cs2.transform);
    log('animation: ' + cs2.animation);
  }, 100);
});
</script>
<script src="speeder_animate.js?v=999"></script>
</body>
</html>
