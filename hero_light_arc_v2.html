<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEEDER · 光在流动</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;700;800&display=swap');
:root {
  --bg-deep: #042018;
  --bg-mid: #0a2820;
  --green-dark: #1a2e28;
  --green-mid: #48564e;
  --green-main: #5D6D56;
  --green-light: #7a9a78;
  --green-glow: #96b896;
  --green-soft: #b8ccb4;
  --text-primary: #d8e8dc;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
a { text-decoration: none; color: inherit; }
body { background: var(--bg-deep); font-family: 'Noto Sans SC', sans-serif; color: var(--text-primary); overflow-x: hidden; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: #042018; }
::-webkit-scrollbar-thumb { background: #5D6D56; border-radius: 2px; }

/* ===== SPLASH ===== */
.splash {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #042018 0%, #0a2820 40%, #1a2e28 65%, #042018 100%);
  transition: opacity 1.2s ease;
}
.splash.fade-out { opacity: 0; pointer-events: none; }
.splash-bg-stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.splash-star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: rgba(150,186,150,0.8); animation: twinkle var(--dur) ease-in-out infinite; animation-delay: var(--delay); }
@keyframes twinkle { 0%,100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } }
.splash-canvas { position: absolute; inset: 0; }
.splash-rings { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
.splash-ring { position: absolute; top: 50%; left: 50%; border: 1px solid rgba(93,109,86,0.18); border-radius: 50%; }
.splash-ring:nth-child(1) { width: 200px; height: 200px; margin: -100px 0 0 -100px; animation: ringPulse 4s ease-out infinite; }
.splash-ring:nth-child(2) { width: 400px; height: 400px; margin: -200px 0 0 -200px; animation: ringPulse 4s ease-out infinite 0.8s; }
.splash-ring:nth-child(3) { width: 600px; height: 600px; margin: -300px 0 0 -300px; animation: ringPulse 4s ease-out infinite 1.6s; }
.splash-ring:nth-child(4) { width: 800px; height: 800px; margin: -400px 0 0 -400px; animation: ringPulse 4s ease-out infinite 2.4s; }
@keyframes ringPulse { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.7); } 30% { opacity: 0.6; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); } }
.splash-countdown-wrap { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; }
.countdown-number { font-family: 'JetBrains Mono', monospace; font-size: clamp(80px, 15vw, 140px); font-weight: 300; color: transparent; -webkit-text-stroke: 2px rgba(150,186,150,0.6); animation: countPulse 1s ease-out forwards; opacity: 0; transform: scale(1.3); }
.countdown-number.show { opacity: 1; transform: scale(1); }
@keyframes countPulse { 0% { opacity: 0; transform: scale(1.5); } 40% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.7); } }
.countdown-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 6px; color: rgba(150,186,150,0.5); text-transform: uppercase; margin-top: 8px; }
.splash-welcome { position: relative; z-index: 10; text-align: center; opacity: 0; transform: translateY(30px); transition: opacity 1.2s ease, transform 1.2s ease; }
.splash-welcome.show { opacity: 1; transform: translateY(0); }
.welcome-line1 { font-size: clamp(12px, 1.5vw, 16px); letter-spacing: 8px; color: rgba(150,186,150,0.5); text-transform: uppercase; margin-bottom: 20px; font-family: 'JetBrains Mono', monospace; }
.welcome-title { font-size: clamp(32px, 5vw, 60px); font-weight: 800; color: var(--green-soft); text-shadow: 0 0 40px rgba(93,109,86,0.8), 0 0 80px rgba(93,109,86,0.4), 0 0 120px rgba(93,109,86,0.15); letter-spacing: 4px; margin-bottom: 20px; line-height: 1.2; }
.welcome-line2 { font-size: clamp(11px, 1.2vw, 14px); letter-spacing: 4px; color: rgba(150,186,150,0.35); font-family: 'JetBrains Mono', monospace; }

/* ===== HERO ===== */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.hero-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 60% 40%, #0a2820 0%, #042018 50%, #020e0a 100%);
  z-index: 0;
}

#heroCanvas {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
}

.hero-content {
  position: relative; z-index: 10;
  max-width: 1200px; margin: 0 auto;
  padding: 120px 24px 80px;
  width: 100%;
}
.hero-eyebrow {
  font-size: 10px; letter-spacing: 3px;
  color: rgba(150,186,150,0.7); text-transform: uppercase;
  margin-bottom: 16px; font-family: 'JetBrains Mono', monospace;
  animation: fadeUp 0.8s ease-out 0.3s both;
}
.hero h1 {
  font-size: clamp(40px, 5.5vw, 72px);
  color: #fff; line-height: 1.08;
  margin-bottom: 24px; font-weight: 800;
  letter-spacing: -0.5px;
  animation: fadeUp 0.8s ease-out 0.5s both;
  text-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.hero h1 .accent {
  color: var(--green-glow);
  text-shadow: 0 0 40px rgba(150,186,150,0.6), 0 0 80px rgba(150,186,150,0.3);
}
.hero-sub {
  font-size: clamp(14px, 1.2vw, 16px);
  color: rgba(255,255,255,0.75); line-height: 1.85; max-width: 520px;
  background: rgba(44,58,59,0.6);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 16px 22px; border-radius: 14px;
  border: 1px solid rgba(150,186,150,0.12);
  margin-bottom: 32px;
  animation: fadeUp 0.8s ease-out 0.7s both;
}
.hero-cta {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(26,58,40,0.9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: #fff; padding: 14px 32px; border-radius: 30px;
  font-size: 14px; font-weight: 600; transition: all 0.3s;
  border: 1px solid rgba(150,186,150,0.25);
  animation: fadeUp 0.8s ease-out 0.9s both;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(93,109,86,0.2);
}
.hero-cta:hover {
  background: rgba(36,78,55,0.95);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(26,58,40,0.5), 0 0 30px rgba(150,186,150,0.2);
}
.hero-stats {
  display: flex; gap: 36px; margin-top: 48px;
  animation: fadeUp 0.8s ease-out 1.1s both;
}
.hero-stat { text-align: left; }
.hero-stat-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px; font-weight: 700;
  color: var(--green-glow); line-height: 1;
  text-shadow: 0 0 20px rgba(150,186,150,0.4);
}
.hero-stat-label {
  font-size: 10px; letter-spacing: 2px;
  color: rgba(150,186,150,0.4); text-transform: uppercase;
  margin-top: 4px; font-family: 'JetBrains Mono', monospace;
}
@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* ===== NAV ===== */
header {
  background: rgba(4,32,24,0.95);
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(93,109,86,0.12);
}
.header-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 64px;
}
.logo-img { height: 100px; width: auto; }
nav { display: flex; gap: 3px; align-items: center; }
nav a {
  font-size: 12px; color: rgba(150,186,150,0.5);
  padding: 6px 12px; border-radius: 8px;
  transition: all 0.25s; font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}
nav a:hover { color: var(--green-glow); background: rgba(93,109,86,0.12); }
nav a.nav-active { color: var(--green-glow) !important; background: rgba(93,109,86,0.16); }
nav a.cta-nav {
  background: rgba(93,109,86,0.14);
  border: 1px solid rgba(150,186,150,0.2);
  color: var(--green-glow) !important; padding: 6px 16px; border-radius: 8px;
}
nav a.cta-nav:hover { background: rgba(93,109,86,0.24); }

@media (max-width: 768px) {
  nav { display: none; }
  .hero h1 { font-size: 30px; }
  .hero-stats { gap: 20px; flex-wrap: wrap; }
}
</style>
</head>
<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="splash-bg-stars" id="splashStars"></div>
  <canvas class="splash-canvas" id="splashCanvas"></canvas>
  <div class="splash-rings">
    <div class="splash-ring"></div>
    <div class="splash-ring"></div>
    <div class="splash-ring"></div>
    <div class="splash-ring"></div>
  </div>
  <div class="splash-countdown-wrap" id="countdownWrap">
    <div class="countdown-number" id="countdownNum">3</div>
    <div class="countdown-label">INITIALIZING</div>
  </div>
  <div class="splash-welcome" id="splashWelcome">
    <div class="welcome-line1">WELCOME TO</div>
    <div class="welcome-title">世必得宇宙</div>

  </div>
</div>

<!-- HERO -->
<div class="hero" id="hero" style="display:none;">
  <div class="hero-bg"></div>
  <canvas id="heroCanvas"></canvas>

  <div class="hero-content">
    <div class="hero-eyebrow">// 全球企业网络加速专家</div>
    <h1>你的网络，<br/><span class="accent">会被守护</span></h1>
    <p class="hero-sub">十年经验 · 2000+ 企业客户 · 自研 AI 运维系统<br/>从外资入华到中资出海，你的跨国连接，我们来保驾护航。</p>
    <button class="hero-cta">了解我们 →</button>

      <div class="hero-stat"><div class="hero-stat-num">2000+</div><div class="hero-stat-label">Enterprise Clients</div></div>
      <div class="hero-stat"><div class="hero-stat-num">10+</div><div class="hero-stat-label">Years Experience</div></div>
      <div class="hero-stat"><div class="hero-stat-num">99.99%</div><div class="hero-stat-label">Uptime SLA</div></div>
    </div>
  </div>
</div>

<!-- NAV -->
<header id="mainNav" style="display:none;">
  <div class="header-inner">
    <img src="logo_new.png" class="logo-img" alt="SPEEDER">
    <nav>
      <a href="#" class="nav-active">首页</a>
      <a href="#">我们做什么</a>
      <a href="#">线路融合池</a>
      <a href="#">信任背书</a>
      <a href="#">智能运维</a>
      <a href="#" class="cta-nav">方案价格</a>
    </nav>
  </div>
</header>

<script>
/* ===== SPLASH: nodes聚散循环 ===== */
(function() {
  const starsContainer = document.getElementById('splashStars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'splash-star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--dur', (1.5 + Math.random() * 3) + 's');
    star.style.setProperty('--delay', Math.random() * 4 + 's');
    star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
    starsContainer.appendChild(star);
  }

  const canvas = document.getElementById('splashCanvas');
  const ctx = canvas.getContext('2d');
  let cw, ch;
  const NUM_NODES = 50;
  const nodes = [];

  function resize() { cw = canvas.width = canvas.offsetWidth; ch = canvas.height = canvas.offsetHeight; }
  window.addEventListener('resize', resize);
  resize();

  const cx = cw / 2, cy = ch / 2;

  // Init nodes at center
  for (let i = 0; i < NUM_NODES; i++) {
    const angle = (i / NUM_NODES) * Math.PI * 2 + Math.random() * 0.3;
    const speed = 1.5 + Math.random() * 2.5;
    nodes.push({
      angle,
      baseAngle: angle,
      dist: 20 + Math.random() * 60,
      speed,
      r: 1.5 + Math.random() * 2,
      opacity: 0.4 + Math.random() * 0.4,
      phase: Math.random() * Math.PI * 2,
      expandSpeed: 0.6 + Math.random() * 0.8,
      expandPhase: Math.random() * Math.PI * 2,
    });
  }

  let cycleTime = 0;
  const CYCLE_DUR = 5000; // 5s per expand+contract cycle

  function drawSplash(ts) {
    ctx.clearRect(0, 0, cw, ch);
    cycleTime = (ts % CYCLE_DUR) / CYCLE_DUR; // 0 to 1

    // Phase: 0-0.5 expand, 0.5-1 contract
    const expandProgress = cycleTime < 0.5
      ? cycleTime * 2  // 0 to 1 expand
      : (1 - cycleTime) * 2; // 1 to 0 contract

    const pulse = Math.sin(ts * 0.002) * 0.5 + 0.5;

    for (let i = 0; i < NUM_NODES; i++) {
      const n = nodes[i];
      // Target distance oscillates with expandProgress
      const targetDist = n.dist + expandProgress * (180 + n.speed * 40);
      const wobble = Math.sin(ts * 0.001 + n.phase) * 8;

      const x = cx + Math.cos(n.angle) * (targetDist + wobble);
      const y = cy + Math.sin(n.angle) * (targetDist + wobble);

      const p = Math.sin(ts * 0.001 + n.phase) * 0.5 + 0.5;

      // Draw lines between nearby nodes
      for (let j = i + 1; j < NUM_NODES; j++) {
        const n2 = nodes[j];
        const t2 = expandProgress;
        const targetDist2 = n2.dist + t2 * (180 + n2.speed * 40);
        const wobble2 = Math.sin(ts * 0.001 + n2.phase) * 8;
        const x2 = cx + Math.cos(n2.angle) * (targetDist2 + wobble2);
        const y2 = cy + Math.sin(n2.angle) * (targetDist2 + wobble2);

        const dx = x - x2, dy = y - y2;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 120 * expandProgress + 40;
        if (dist < maxDist) {
          const alpha = (1 - dist / maxDist) * 0.35 * (0.5 + expandProgress * 0.5);
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2);
          ctx.strokeStyle = `rgba(150,186,150,${alpha})`;
          ctx.lineWidth = 0.6; ctx.stroke();
        }
      }

      // Draw node with glow
      const glowAlpha = (0.4 + p * 0.4) * (0.6 + expandProgress * 0.4);
      ctx.beginPath();
      ctx.arc(x, y, n.r * (0.8 + p * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(150,186,150,${glowAlpha})`;
      ctx.shadowColor = '#5D6D56';
      ctx.shadowBlur = 8 + p * 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Bright center
      if (expandProgress > 0.3) {
        ctx.beginPath();
        ctx.arc(x, y, n.r * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,220,200,${(expandProgress - 0.3) * 0.8})`;
        ctx.fill();
      }
    }

    requestAnimationFrame(drawSplash);
  }
  requestAnimationFrame(drawSplash);

  // Countdown
  const countdownEl = document.getElementById('countdownNum');
  const countdownWrap = document.getElementById('countdownWrap');
  const splashWelcome = document.getElementById('splashWelcome');
  const splash = document.getElementById('splash');
  const mainNav = document.getElementById('mainNav');
  const hero = document.getElementById('hero');

  let count = 3;
  function showCount(n) {
    countdownEl.textContent = n;
    countdownEl.classList.remove('show');
    void countdownEl.offsetWidth;
    countdownEl.classList.add('show');
  }
  showCount(count);

  const countInterval = setInterval(() => {
    count--;
    if (count > 0) {
      showCount(count);
    } else {
      clearInterval(countInterval);
      countdownWrap.style.transition = 'opacity 0.5s ease';
      countdownWrap.style.opacity = '0';
      setTimeout(() => {
        countdownWrap.style.display = 'none';
        splashWelcome.classList.add('show');
        setTimeout(() => {
          splash.classList.add('fade-out');
          setTimeout(() => {
            splash.style.display = 'none';
            mainNav.style.display = 'block';
            hero.style.display = 'flex';
            hero.style.opacity = '0';
            requestAnimationFrame(() => {
              hero.style.transition = 'opacity 1s ease';
              hero.style.opacity = '1';
              initHero();
            });
          }, 1200);
        }, 2200);
      }, 500);
    }
  }, 1000);
})();

/* ===== HERO: Light Arc Animation ===== */
function initHero() {
  const canvas = document.getElementById('heroCanvas');
  const ctx = canvas.getContext('2d');
  let width, height;

  function resize() {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // City nodes - spread across the canvas
  const cityNodes = [
    { x: 0.08, y: 0.40 }, { x: 0.16, y: 0.20 }, { x: 0.28, y: 0.58 },
    { x: 0.40, y: 0.15 }, { x: 0.50, y: 0.42 }, { x: 0.60, y: 0.22 },
    { x: 0.70, y: 0.62 }, { x: 0.80, y: 0.28 }, { x: 0.90, y: 0.48 },
    { x: 0.12, y: 0.72 }, { x: 0.35, y: 0.80 }, { x: 0.65, y: 0.76 },
    { x: 0.88, y: 0.68 }, { x: 0.45, y: 0.68 }, { x: 0.22, y: 0.48 },
  ].map(n => ({ x: n.x * width, y: n.y * height }));

  // Arc connections
  const arcs = [
    [0, 1], [1, 3], [3, 5], [5, 7], [7, 9],
    [0, 2], [2, 4], [4, 6], [6, 8], [8, 12],
    [1, 4], [3, 4], [4, 7], [4, 8],
    [10, 4], [11, 6], [13, 4], [14, 2],
    [2, 13], [6, 11],
  ];

  // Precompute bezier control points for each arc (stable, not random per frame)
  const arcControlPoints = arcs.map(([a, b]) => {
    const na = cityNodes[a], nb = cityNodes[b];
    const midX = (na.x + nb.x) / 2;
    const midY = Math.min(na.y, nb.y) - 90 - Math.random() * 40;
    return { midX, midY };
  });

  // Flowing particles
  const flowParticles = [];
  const NUM_FLOW = 22;
  for (let i = 0; i < NUM_FLOW; i++) {
    const arcIdx = i % arcs.length;
    flowParticles.push({
      arcIdx,
      progress: Math.random(),
      speed: 0.004 + Math.random() * 0.003,
      size: 2.5 + Math.random() * 2.5,
      opacity: 0.6 + Math.random() * 0.4,
    });
  }

  // Ambient background particles
  const bgParticles = [];
  for (let i = 0; i < 30; i++) {
    bgParticles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: 1 + Math.random() * 1.5,
      speed: 0.2 + Math.random() * 0.5,
      opacity: 0.2 + Math.random() * 0.3,
      phase: Math.random() * Math.PI * 2,
    });
  }

  let time = 0;

  function getBezierPoint(na, nb, midX, midY, t) {
    const t1 = 1 - t;
    return {
      x: t1 * t1 * na.x + 2 * t1 * t * midX + t * t * nb.x,
      y: t1 * t1 * na.y + 2 * t1 * t * midY + t * t * nb.y,
    };
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    time += 0.016;

    // Ambient floating particles
    for (const p of bgParticles) {
      p.y -= p.speed * 0.3;
      p.x += Math.sin(time * 0.5 + p.phase) * 0.3;
      if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }

      const pp = Math.sin(time + p.phase) * 0.5 + 0.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(150,186,150,${p.opacity * (0.5 + pp * 0.5)})`;
      ctx.fill();
    }

    // Draw STATIC arcs - visible thick lines
    ctx.globalAlpha = 0.25;
    for (let ai = 0; ai < arcs.length; ai++) {
      const [a, b] = arcs[ai];
      const na = cityNodes[a], nb = cityNodes[b];
      const { midX, midY } = arcControlPoints[ai];

      ctx.beginPath();
      ctx.moveTo(na.x, na.y);
      ctx.quadraticCurveTo(midX, midY, nb.x, nb.y);
      ctx.strokeStyle = '#48564e';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Draw flowing particles WITH visible trails
    for (const fp of flowParticles) {
      const [a, b] = arcs[fp.arcIdx];
      const na = cityNodes[a], nb = cityNodes[b];
      const { midX, midY } = arcControlPoints[fp.arcIdx];

      // Current position
      const pos = getBezierPoint(na, nb, midX, midY, fp.progress);
      // Trail start (15% back along curve)
      const trailT = Math.max(0, fp.progress - 0.12);
      const trailPos = getBezierPoint(na, nb, midX, midY, trailT);

      // Draw trail
      const trailGrad = ctx.createLinearGradient(trailPos.x, trailPos.y, pos.x, pos.y);
      trailGrad.addColorStop(0, 'rgba(93,109,86,0)');
      trailGrad.addColorStop(1, `rgba(150,186,150,${fp.opacity})`);

      ctx.beginPath();
      ctx.moveTo(trailPos.x, trailPos.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = trailGrad;
      ctx.lineWidth = fp.size * 0.7;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Glow head
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, fp.size, 0, Math.PI * 2);
      ctx.fillStyle = '#96b896';
      ctx.shadowColor = '#96b896';
      ctx.shadowBlur = 15;
      ctx.globalAlpha = fp.opacity;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // Bright core
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, fp.size * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#c8dcc8';
      ctx.fill();

      fp.progress += fp.speed;
      if (fp.progress > 1) {
        fp.progress = 0;
        if (Math.random() > 0.6) {
          fp.arcIdx = Math.floor(Math.random() * arcs.length);
          fp.size = 2.5 + Math.random() * 2.5;
          fp.opacity = 0.6 + Math.random() * 0.4;
        }
      }
    }

    // City nodes with strong pulse
    for (let i = 0; i < cityNodes.length; i++) {
      const n = cityNodes[i];
      const pulse = Math.sin(time * 1.8 + i * 1.1) * 0.5 + 0.5;
      const r = 3 + pulse * 2;

      // Outer halo
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(93,109,86,${0.1 + pulse * 0.12})`;
      ctx.fill();

      // Mid glow
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(150,186,150,${0.2 + pulse * 0.2})`;
      ctx.shadowColor = '#5D6D56';
      ctx.shadowBlur = 12 + pulse * 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Core
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(150,186,150,${0.6 + pulse * 0.4})`;
      ctx.fill();

      // Bright center dot
      ctx.beginPath();
      ctx.arc(n.x, n.y, r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,240,220,${0.7 + pulse * 0.3})`;
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }
  draw();
}
</script>
</body>
</html>
