<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEEDER NETWORKS — 简化版首页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #042018;
  --bg-mid: #0a2820;
  --green-dark: #1a2e28;
  --green-mid: #48564e;
  --primary: #5D6D56;
  --secondary: #7a9a78;
  --light: #96b896;
  --soft: #b8ccb4;
  --text-primary: #d8e8dc;
  --text-secondary: rgba(150,186,150,0.6);
  --highlight: #A6B58F;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 400;
  overflow-x: hidden;
}

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  height: 64px;
  background: rgba(4,32,24,0.95);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(93,109,86,0.12);
}
.logo-wrap { display: flex; align-items: center; height: 64px; }
.logo-img { height: 100px; width: auto; }
.nav-links {
  display: flex;
  gap: 4px;
  list-style: none;
  align-items: center;
}
.nav-links a {
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 400;
  color: rgba(150,186,150,0.5);
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 8px;
  transition: all 0.25s;
  white-space: nowrap;
}
.nav-links a:hover { color: var(--light); background: rgba(93,109,86,0.12); }
.nav-btn-outline {
  background: rgba(93,109,86,0.1) !important;
  border: 1px solid rgba(150,186,150,0.15) !important;
  color: var(--light) !important;
}
.nav-cta {
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  color: var(--bg) !important;
  background: var(--primary);
  padding: 8px 20px;
  border-radius: 8px;
  text-decoration: none;
  transition: background 0.3s, transform 0.2s;
}
.nav-cta:hover { background: var(--secondary); transform: scale(1.02); }

/* ══════════════════════════════════════════
   HERO — 极简版
══════════════════════════════════════════ */
#hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}

/* 背景图 */
.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero-bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 简洁渐变遮罩：底部渐暗到文字区 */
.hero-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(to bottom, rgba(4,32,24,0.3) 0%, transparent 30%, transparent 50%, rgba(4,32,24,0.85) 85%, var(--bg) 100%);
}

/* Hero 文字区 */
.hero-content {
  position: relative;
  z-index: 2;
  padding: 0 8%;
  max-width: 700px;
  animation: fadeInUp 0.8s ease both;
}

.hero-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 4px;
  color: rgba(150,186,150,0.7);
  text-transform: uppercase;
  margin-bottom: 20px;
}

.hero-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 700;
  line-height: 1.1;
  color: var(--text-primary);
  margin-bottom: 20px;
  letter-spacing: -1px;
}
.hero-title .accent {
  color: var(--light);
}

.hero-sub {
  font-size: clamp(15px, 1.8vw, 18px);
  color: rgba(255,255,255,0.75);
  margin-bottom: 40px;
  line-height: 1.8;
  max-width: 520px;
}

.hero-actions {
  display: flex;
  gap: 16px;
}
.btn-primary {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 600;
  padding: 14px 32px;
  border-radius: 30px;
  text-decoration: none;
  cursor: pointer;
  border: none;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-primary.filled {
  background: rgba(26,58,40,0.9);
  color: #fff;
  border: 1px solid rgba(150,186,150,0.25);
  backdrop-filter: blur(12px);
}
.btn-primary.filled:hover { background: rgba(36,78,55,0.95); transform: translateY(-2px); }
.btn-primary.outline {
  background: transparent;
  color: var(--light);
  border: 1px solid rgba(150,186,150,0.3);
}
.btn-primary.outline:hover { border-color: var(--light); background: rgba(150,186,150,0.05); }

/* ══════════════════════════════════════════
   STATS STRIP
══════════════════════════════════════════ */
#stats-strip {
  padding: 48px 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-top: 1px solid rgba(93,109,86,0.1);
  border-bottom: 1px solid rgba(93,109,86,0.1);
  background: rgba(93,109,86,0.03);
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  width: 100%;
  max-width: 1100px;
}
.stat-item {
  text-align: center;
  padding: 24px 32px;
  position: relative;
}
.stat-item + .stat-item::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--primary), transparent);
  opacity: 0.4;
}
.stat-number {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 48px;
  font-weight: 700;
  color: var(--light);
  line-height: 1;
}
.stat-number em { font-style: normal; color: var(--primary); }
.stat-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 8px;
  letter-spacing: 1px;
}

@keyframes fadeInUp {
  0%   { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .nav-links { display: none; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  #stats-strip { padding: 40px 24px; }
}
</style>
</head>
<body>

<!-- NAV -->
<header>
  <div class="logo-wrap">
    <img src="logo_new.png" class="logo-img" alt="SPEEDER NETWORKS">
  </div>
  <ul class="nav-links">
    <li><a href="index.html">首页</a></li>
    <li><a href="sdwan.html">线路融合池</a></li>
    <li><a href="unisase.html">网络安全</a></li>
    <li><a href="ai.html">AI智能运维</a></li>
    <li><a href="products.html">代理产品</a></li>
    <li><a href="about.html">关于我们</a></li>
    <li><a href="about.html#contact" class="nav-cta">联系我们</a></li>
  </ul>
</header>

<!-- HERO -->
<section id="hero">
  <div class="hero-bg">
    <img src="hero_suzhou_vortex_real.png" alt="">
  </div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <p class="hero-eyebrow">// 连接无忧，守护无虞</p>
    <h1 class="hero-title">十年深耕<br/><span class="accent">一站式守护</span></h1>
    <p class="hero-sub">专注跨国网络连接与安全一站式服务<br>让每一次连接，都值得信赖</p>
    <div class="hero-actions">
      <a href="sdwan.html" class="btn-primary filled">探索方案 →</a>
      <a href="about.html#contact" class="btn-primary outline">联系我们</a>
    </div>
  </div>
</section>

<!-- STATS -->
<section id="stats-strip">
  <div class="stats-grid">
    <div class="stat-item">
      <div class="stat-number"><em>600</em>+</div>
      <div class="stat-label">全球POP节点 / Global POP Nodes</div>
    </div>
    <div class="stat-item">
      <div class="stat-number"><em>38</em></div>
      <div class="stat-label">城市骨干网覆盖 / City Backbone Coverage</div>
    </div>
    <div class="stat-item">
      <div class="stat-number"><em>150</em>+</div>
      <div class="stat-label">安全威胁规则库 / Threat Rules</div>
    </div>
    <div class="stat-item">
      <div class="stat-number"><em>&lt;1</em>ms</div>
      <div class="stat-label">安全处理延时 / Security Latency</div>
    </div>
  </div>
</section>

</body>
</html>
