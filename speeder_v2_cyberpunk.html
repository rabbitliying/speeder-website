<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEEDER NETWORKS — 现代城市版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --deep-green: #2C3A3B;
  --dark-green: #323b34;
  --forest-green: #48564e;
  --sage: #6a7c73;
  --fog: #8e9d96;
  --silver: #b0bcb4;
  --mist: #cbd3cf;
  --olive: #5D6D56;
  --light-sage: #A6B58F;
  --teal-dark: #3D6364;
  --teal-bright: #5E9999;
  --teal-pale: #A8D4D4;
  --amber: #E8A84C;
  --indigo: #1B2A4A;
}

body {
  background: var(--dark-green);
  color: var(--mist);
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  overflow-x: hidden;
}

/* ========== 导航 ========== */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 40px;
  background: linear-gradient(to bottom, rgba(44,58,59,0.95), rgba(44,58,59,0));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(94,153,153,0.1);
}
.navbar .logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--silver);
  letter-spacing: 4px;
  text-decoration: none;
}
.navbar .logo span { color: var(--teal-bright); }
.navbar nav { margin-left: auto; display: flex; gap: 36px; }
.navbar nav a {
  font-size: 12px;
  color: rgba(176,188,180,0.65);
  text-decoration: none;
  letter-spacing: 3px;
  text-transform: uppercase;
  transition: color 0.3s;
}
.navbar nav a:hover { color: var(--teal-pale); }

/* ========== Hero ========== */
.hero {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  filter: brightness(0.6) saturate(1.2) contrast(1.08);
  animation: heroZoom 25s ease-in-out infinite alternate;
}
@keyframes heroZoom {
  0% { transform: scale(1); }
  100% { transform: scale(1.1); }
}

/* 极光光晕 */
.hero-glow {
  position: absolute;
  top: -15%;
  right: -5%;
  width: 65%;
  height: 75%;
  background: radial-gradient(ellipse at center, rgba(94,153,153,0.22) 0%, rgba(61,99,100,0.08) 40%, transparent 70%);
  z-index: 2;
  animation: glowPulse 8s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.7; transform: scale(1) translateY(0); }
  50% { opacity: 1; transform: scale(1.07) translateY(-15px); }
}

/* 右侧补光 */
.hero::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 40%;
  height: 100%;
  background: radial-gradient(ellipse at top right, rgba(61,99,100,0.15) 0%, transparent 60%);
  z-index: 2;
  pointer-events: none;
}

/* 底部渐变 */
.hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(to top, rgba(44,58,59,0.97) 0%, rgba(44,58,59,0.5) 45%, transparent 100%);
  z-index: 1;
  pointer-events: none;
}

/* 数据光弧 SVG */
.hero-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
  pointer-events: none;
  overflow: visible;
}

/* 光弧流动 */
.arc-glow {
  fill: none;
  stroke: url(#arcGrad);
  stroke-width: 2.5;
  stroke-linecap: round;
  opacity: 0.3;
  filter: blur(3px);
}
.arc-line {
  fill: none;
  stroke: url(#arcGrad2);
  stroke-width: 1;
  stroke-linecap: round;
  opacity: 0.75;
}
.arc-particle {
  fill: var(--teal-pale);
  filter: drop-shadow(0 0 6px var(--teal-bright));
}

/* ========== Hero 内容 ========== */
.hero-content {
  position: absolute;
  bottom: 16%;
  left: 5%;
  z-index: 10;
  max-width: 580px;
}

.hero-badge {
  display: inline-block;
  margin-bottom: 18px;
  padding: 7px 20px;
  background: rgba(94,153,153,0.12);
  border: 1px solid rgba(94,153,153,0.25);
  border-radius: 30px;
  color: var(--teal-pale);
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  backdrop-filter: blur(12px);
}

.hero-content h1 {
  font-size: clamp(36px, 5.5vw, 76px);
  font-weight: 700;
  color: #fff;
  letter-spacing: 6px;
  line-height: 1.2;
  margin-bottom: 18px;
  text-shadow: 0 4px 40px rgba(0,0,0,0.85);
}

.hero-content h1 em {
  font-style: normal;
  color: var(--amber);
}

.hero-content p {
  font-size: clamp(14px, 1.4vw, 17px);
  color: rgba(184,220,192,0.8);
  line-height: 1.9;
  max-width: 460px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.8);
}

.hero-cta {
  margin-top: 32px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.btn-primary {
  padding: 13px 36px;
  background: linear-gradient(135deg, var(--teal-dark), var(--teal-bright));
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 13px;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 6px 28px rgba(94,153,153,0.35);
  transition: all 0.3s;
}
.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 40px rgba(94,153,153,0.55);
}

.btn-outline {
  padding: 13px 36px;
  background: transparent;
  border: 1px solid rgba(176,220,192,0.35);
  border-radius: 8px;
  color: var(--teal-pale);
  font-size: 13px;
  letter-spacing: 3px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  transition: all 0.3s;
}
.btn-outline:hover {
  border-color: rgba(94,153,153,0.6);
  color: #fff;
}

/* ========== 右侧数据卡片 ========== */
.hero-stats {
  position: absolute;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.stat-card {
  padding: 18px 26px;
  background: rgba(10,38,30,0.5);
  backdrop-filter: blur(28px);
  border: 1px solid rgba(94,153,153,0.15);
  border-radius: 16px;
  min-width: 210px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  animation: statFloat 4.5s ease-in-out infinite;
}
.stat-card:nth-child(1) { animation-delay: 0s; }
.stat-card:nth-child(2) { animation-delay: 0.7s; }
.stat-card:nth-child(3) { animation-delay: 1.4s; }

@keyframes statFloat {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-8px); }
}

.stat-label {
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--teal-bright);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.stat-value {
  font-size: 26px;
  font-weight: 700;
  color: var(--mist);
}
.stat-sub {
  font-size: 11px;
  color: rgba(168,212,212,0.45);
  margin-top: 4px;
}

/* ========== 底部节点条 ========== */
.hero-nodes {
  position: absolute;
  bottom: 4%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 36px;
}

.node-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.node-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--teal-bright);
  box-shadow: 0 0 14px var(--teal-bright), 0 0 28px rgba(94,153,153,0.4);
  animation: nodeBlink 2.5s ease-in-out infinite;
}
.node-dot:nth-child(2) { animation-delay: 0.4s; }
.node-dot:nth-child(3) { animation-delay: 0.8s; }
.node-dot:nth-child(4) { animation-delay: 1.2s; }
.node-dot:nth-child(5) { animation-delay: 1.6s; }

@keyframes nodeBlink {
  0%, 100% { opacity: 0.2; transform: scale(0.7); }
  50% { opacity: 1; transform: scale(1.3); }
}

.node-name {
  font-size: 9px;
  letter-spacing: 2px;
  color: rgba(168,212,212,0.4);
  text-transform: uppercase;
}

.node-connector {
  width: 50px;
  height: 1px;
  background: linear-gradient(to right, rgba(94,153,153,0.35), transparent);
}

/* ========== 光流特效 ========== */
.light-beam {
  position: absolute;
  width: 2px;
  background: linear-gradient(to bottom, transparent, var(--teal-bright), transparent);
  opacity: 0;
  z-index: 3;
  animation: lightFlow 3s ease-in-out infinite;
}
@keyframes lightFlow {
  0% { opacity: 0; transform: translateY(-100%); }
  50% { opacity: 0.6; }
  100% { opacity: 0; transform: translateY(100vh); }
}
</style>
</head>
<body>

<!-- 导航 -->
<div class="navbar">
  <a class="logo" href="#">SPEEDER <span>NETWORKS</span></a>
  <nav>
    <a href="#">首页</a>
    <a href="#">SD-WAN</a>
    <a href="#">UniSASE</a>
    <a href="#">AI运维</a>
    <a href="#">关于</a>
  </nav>
</div>

<!-- Hero -->
<div class="hero">

  <!-- 背景图 -->
  <img class="hero-bg" 
    src="hero_modern_city_v1---139d4eb5-585e-4528-8797-e4d75e86ac50.png"
    alt="Futuristic city">

  <!-- 极光光晕 -->
  <div class="hero-glow"></div>

  <!-- 右侧补光 -->
  <div style="position:absolute;top:0;right:0;width:40%;height:100%;background:radial-gradient(ellipse at top right, rgba(61,99,100,0.15) 0%, transparent 60%);z-index:2;pointer-events:none"></div>

  <!-- 数据光弧 SVG -->
  <svg class="hero-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3D6364" stop-opacity="0"/>
        <stop offset="35%" stop-color="#5E9999" stop-opacity="0.6"/>
        <stop offset="65%" stop-color="#A8D4D4" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#3D6364" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="arcGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3D6364" stop-opacity="0"/>
        <stop offset="30%" stop-color="#5E9999" stop-opacity="0.45"/>
        <stop offset="60%" stop-color="#A8D4D4" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#3D6364" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- 汇聚光弧 -->
    <path class="arc-glow" d="M -80,280 Q 480,580 960,540"/>
    <path class="arc-line" d="M -80,280 Q 480,580 960,540"/>

    <path class="arc-glow" d="M 180,1080 Q 580,740 960,540"/>
    <path class="arc-line" d="M 180,1080 Q 580,740 960,540"/>

    <path class="arc-glow" d="M 2000,220 Q 1380,430 960,540"/>
    <path class="arc-line" d="M 2000,220 Q 1380,430 960,540"/>

    <path class="arc-glow" d="M 2000,820 Q 1480,670 960,540"/>
    <path class="arc-line" d="M 2000,820 Q 1480,670 960,540"/>

    <!-- 横穿光弧 -->
    <path class="arc-glow" d="M 0,620 Q 470,460 960,440 Q 1440,420 1920,260"/>
    <path class="arc-line" d="M 0,620 Q 470,460 960,440 Q 1440,420 1920,260"/>

    <!-- 流动光点 -->
    <circle r="3.5" class="arc-particle">
      <animateMotion dur="5s" repeatCount="indefinite" path="M -80,280 Q 480,580 960,540"/>
    </circle>
    <circle r="2.5" class="arc-particle">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M 180,1080 Q 580,740 960,540" begin="1.5s"/>
    </circle>
    <circle r="3" class="arc-particle">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M 2000,220 Q 1380,430 960,540" begin="3s"/>
    </circle>
    <circle r="2" class="arc-particle">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 2000,820 Q 1480,670 960,540" begin="0.8s"/>
    </circle>
    <circle r="2.5" class="arc-particle">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M 0,620 Q 470,460 960,440 Q 1440,420 1920,260" begin="2.2s"/>
    </circle>
  </svg>

  <!-- Hero 内容 -->
  <div class="hero-content">
    <span class="hero-badge">SD-WAN · 安全组网 · 智能运维</span>
    <h1>数据的光<br><em>在流动</em></h1>
    <p>全球 98+ 节点，毫秒级线路切换<br>每一次连接，都是一次光的抵达</p>
    <div class="hero-cta">
      <button class="btn-primary">了解方案</button>
      <button class="btn-outline">联系我们</button>
    </div>
  </div>

  <!-- 右侧数据卡片 -->
  <div class="hero-stats">
    <div class="stat-card">
      <div class="stat-label">全球节点</div>
      <div class="stat-value">98+</div>
      <div class="stat-sub">覆盖 40+ 国家地区</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">线路融合</div>
      <div class="stat-value">&lt;30ms</div>
      <div class="stat-sub">毫秒级自动切换</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">安全等级</div>
      <div class="stat-value">金融级</div>
      <div class="stat-sub">端到端加密传输</div>
    </div>
  </div>

  <!-- 底部节点 -->
  <div class="hero-nodes">
    <div class="node-item"><div class="node-dot"></div><span class="node-name">北京</span></div>
    <div class="node-connector"></div>
    <div class="node-item"><div class="node-dot"></div><span class="node-name">上海</span></div>
    <div class="node-connector"></div>
    <div class="node-item"><div class="node-dot"></div><span class="node-name">东京</span></div>
    <div class="node-connector"></div>
    <div class="node-item"><div class="node-dot"></div><span class="node-name">新加坡</span></div>
    <div class="node-connector"></div>
    <div class="node-item"><div class="node-dot"></div><span class="node-name">法兰克福</span></div>
  </div>

</div>

</body>
</html>
